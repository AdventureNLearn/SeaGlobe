# SeaGlobe chat pass-through: OPTIONAL, for a visitor to run on THEIR OWN Cloudflare account.
# The app as shipped does not use it (it calls api.x.ai directly from the browser with the visitor's own key).
# The Worker holds no key and stores nothing; callers send their own key in the Authorization header.
# No secrets in this file. Set ALLOWED_ORIGINS to the site(s) you open SeaGlobe from.
name = "seaglobe-chat-passthrough"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
ALLOWED_ORIGINS = "https://adventurenlearn.github.io"
